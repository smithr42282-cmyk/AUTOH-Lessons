<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Question 1 of 4 | ETCS Knowledge Check | Honda PACT</title>
<style>

  :root{
    --red:#CC0000; --red-dark:#960000; --black:#1a1a1a; --grey:#4a4a4a;
    --light:#f5f5f5; --white:#ffffff; --border:#d9d9d9; --good:#1e7a34;
    --bad:#b3261e; --focus:#0b5fff;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Segoe UI",Arial,Helvetica,sans-serif;background:var(--light);color:var(--black);font-size:18px;line-height:1.5;}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
  .skip-link{position:absolute;left:-999px;top:0;background:var(--red);color:#fff;padding:10px 16px;z-index:200;border-radius:0 0 6px 0;font-weight:700;text-decoration:none;}
  .skip-link:focus{left:0;}
  a{color:var(--red-dark);}
  a:focus,button:focus-visible,input:focus-visible,textarea:focus-visible,label:focus-within{outline:3px solid var(--focus);outline-offset:2px;}
  header.brandbar{background:var(--black);color:var(--white);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:6px solid var(--red);flex-wrap:wrap;gap:8px;}
  header.brandbar .brand{display:flex;align-items:center;gap:12px;}
  header.brandbar .swatch{width:22px;height:22px;background:var(--red);border-radius:3px;}
  header.brandbar h1{font-size:19px;margin:0;font-weight:700;}
  header.brandbar .prog{font-size:15px;color:#eee;text-align:right;}
  header.brandbar .prog .score{display:block;font-weight:700;color:#ffdada;}
  .wrap{max-width:900px;margin:0 auto;padding:20px 20px 100px;}
  .toolbar{display:flex;gap:10px;justify-content:flex-end;margin-bottom:14px;flex-wrap:wrap;}
  button.util{background:var(--white);border:2px solid var(--black);color:var(--black);padding:8px 16px;border-radius:6px;font-size:15px;cursor:pointer;font-weight:600;}
  button.util:hover{background:var(--black);color:var(--white);}
  nav.pagelinks{margin-bottom:16px;}
  nav.pagelinks ol{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px;}
  nav.pagelinks a{display:inline-block;font-size:12px;font-weight:600;padding:5px 9px;border-radius:14px;background:var(--white);border:1px solid var(--border);text-decoration:none;color:var(--grey);}
  nav.pagelinks a[aria-current="page"]{background:var(--red);border-color:var(--red-dark);color:var(--white);}
  nav.pagelinks a:hover{border-color:var(--red);}
  .pagecard{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:30px 32px;min-height:260px;box-shadow:0 2px 6px rgba(0,0,0,.06);}
  .pagecard:focus{outline:none;}
  .eyebrow{color:var(--red-dark);font-weight:700;font-size:14px;margin:0 0 6px;letter-spacing:.2px;}
  h2{font-size:24px;margin:0 0 16px;border-bottom:4px solid var(--red);padding-bottom:8px;}
  p{margin:0 0 12px;}
  .studentinfo{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
  label.field{display:block;font-weight:600;font-size:14px;margin-bottom:4px;color:var(--grey);}
  input[type=text],input[type=date]{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:16px;}
  fieldset.question{border:none;padding:0;margin:0;}
  legend.qtext, label.qtext{font-weight:600;margin:0 0 12px;padding:0;font-size:inherit;color:inherit;width:100%;display:block;}
  .pts{font-size:13px;color:var(--grey);font-weight:600;}
  .lookup-tag{display:inline-block;background:#fff4f4;color:var(--red-dark);border:1px solid var(--red);font-size:12px;font-weight:700;padding:2px 8px;border-radius:12px;letter-spacing:.3px;margin-left:6px;}
  .opts label{display:block;background:var(--light);border:2px solid var(--border);border-radius:6px;padding:9px 12px;margin-bottom:8px;cursor:pointer;font-size:16px;}
  .opts label:hover{border-color:var(--red);}
  .opts input{margin-right:8px;}
  textarea{width:100%;min-height:100px;border:1px solid var(--border);border-radius:6px;padding:10px;font-size:16px;font-family:inherit;resize:none;overflow:hidden;}
  .instr-score{margin-top:10px;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--grey);}
  .instr-score label{font-weight:600;color:var(--grey);}
  .instr-score input{width:60px;padding:4px 6px;border:1px solid var(--border);border-radius:4px;text-align:center;}
  .checkbtn{background:var(--red);color:var(--white);border:none;padding:9px 18px;border-radius:6px;font-weight:700;cursor:pointer;font-size:15px;margin-top:4px;}
  .checkbtn:hover{background:var(--red-dark);}
  .feedback{margin-top:10px;font-weight:700;padding:8px 10px;border-radius:6px;display:none;}
  .feedback.correct{display:block;background:#eaf6ec;color:var(--good);}
  .feedback.incorrect{display:block;background:#fdecea;color:var(--bad);}
  .callout{border-left:5px solid var(--red);background:#fff4f4;padding:12px 16px;margin:14px 0 0;border-radius:0 6px 6px 0;font-size:15px;}
  .summary-table{width:100%;border-collapse:collapse;margin:14px 0;}
  .summary-table th,.summary-table td{border:1px solid var(--border);padding:8px 10px;text-align:left;font-size:15px;}
  .summary-table th{background:var(--black);color:var(--white);}
  nav.slidenav{position:sticky;bottom:0;left:0;right:0;background:var(--white);border-top:2px solid var(--black);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:20px;border-radius:0 0 10px 10px;}
  a.navbtn,button.navbtn{background:var(--black);color:var(--white);border:none;padding:10px 20px;border-radius:6px;font-weight:700;cursor:pointer;font-size:15px;text-decoration:none;display:inline-block;}
  a.navbtn.disabled{background:#bcbcbc;color:#666;pointer-events:none;}
  a.navbtn.primary,button.navbtn.primary{background:var(--red);}
  a.navbtn.primary:hover,button.navbtn.primary:hover{background:var(--red-dark);}
  @media print{
    header.brandbar,.toolbar,nav.slidenav,nav.pagelinks,.skip-link{display:none;}
    .pagecard{box-shadow:none;border:1px solid #999;}
  }
  @media (max-width:600px){
    .pagecard{padding:20px 18px;}
    .studentinfo{grid-template-columns:1fr;}
    h2{font-size:21px;}
  }

</style>
</head>
<body>

<a class="skip-link" href="#main">Skip to question content</a>

<header class="brandbar">
  <div class="brand">
    <div class="swatch" aria-hidden="true"></div>
    <h1>Honda PACT &mdash; ETCS Knowledge Check</h1>
  </div>
  <div class="prog" id="progLabel" role="status" aria-live="polite">
    Page 2 of 12
    <span class="score" id="scoreLabel">Score: 0 / 24</span>
  </div>
</header>

<div class="wrap">
  <div class="toolbar">
    <button class="util" onclick="window.print()">Print This Page</button>
    <button class="util" id="saveBtn">Save Progress</button>
    <button class="util" id="clearBtn">Clear All</button>
  </div>

  <main id="main">
    <section class="pagecard" tabindex="-1" aria-labelledby="h-main">
      <p class="eyebrow">SECTION A — CONCEPT REVIEW (AUTO-GRADED)</p>
      <h2 id="h-main">Question 1 of 4</h2>
      
<fieldset class="question" data-qid="a1">
  <legend class="qtext">The ECM/PCM cross-checks APP1 and APP2 primarily to&hellip; <span class="pts">(2 pts)</span></legend>
  <div class="opts">
    <label><input type="radio" name="a1" value="a"> Improve fuel economy</label>
<label><input type="radio" name="a1" value="b"> Confirm the pedal position signal is reliable before commanding throttle angle</label>
<label><input type="radio" name="a1" value="c"> Control transmission shift points</label>
<label><input type="radio" name="a1" value="d"> Measure intake air temperature</label>
  </div>
  <button type="button" class="checkbtn" onclick="checkMC_a1()">Check Answer</button>
  <div class="feedback" role="status" aria-live="polite"></div>
</fieldset>

    </section>
  </main>
</div>

<script>

function loadData(){
  try{
    const raw = localStorage.getItem('etcs_kc_progress_page');
    return raw ? JSON.parse(raw) : {values:{}, autoScores:{}};
  }catch(e){ return {values:{}, autoScores:{}}; }
}
function saveData(data){
  try{ localStorage.setItem('etcs_kc_progress_page', JSON.stringify(data)); }catch(e){}
}
function computeTotal(data){
  let total = 0;
  Object.values(data.autoScores||{}).forEach(v=> total += (parseFloat(v)||0));
  Object.keys(data.values||{}).forEach(k=>{
    if(k.indexOf('ms_')===0){ total += (parseFloat(data.values[k])||0); }
  });
  return total;
}
function updateScoreDisplay(data){
  const total = computeTotal(data);
  const el = document.getElementById('scoreLabel');
  if(el) el.textContent = `Score: ${total} / 24`;
  const fb = document.getElementById('finalScoreBox');
  if(fb) fb.textContent = `Current total: ${total} / 24`;
}
let DATA = loadData();
updateScoreDisplay(DATA);

document.querySelectorAll('input[type=text],input[type=date]').forEach(function(i){
  if(DATA.values[i.id]!==undefined) i.value = DATA.values[i.id];
  i.addEventListener('input', function(){ DATA.values[i.id]=i.value; saveData(DATA); });
});
document.querySelectorAll('textarea.autoexp').forEach(function(t){
  if(DATA.values[t.id]!==undefined){ t.value = DATA.values[t.id]; }
  t.style.height='auto'; t.style.height=(t.scrollHeight)+'px';
  t.addEventListener('input', function(){
    DATA.values[t.id]=t.value; saveData(DATA);
    t.style.height='auto'; t.style.height=(t.scrollHeight)+'px';
  });
});
document.querySelectorAll('.mscore').forEach(function(m){
  if(DATA.values[m.id]!==undefined) m.value = DATA.values[m.id];
  m.addEventListener('input', function(){
    const max=parseFloat(m.dataset.max);
    if(parseFloat(m.value)>max) m.value=max;
    if(parseFloat(m.value)<0) m.value=0;
    DATA.values[m.id]=m.value; saveData(DATA); updateScoreDisplay(DATA);
  });
});
document.querySelectorAll('input[type=radio]').forEach(function(r){
  const key='radio_'+r.name;
  if(DATA.values[key]===r.value) r.checked=true;
});

document.getElementById('saveBtn').addEventListener('click', function(){
  saveData(DATA);
  alert('Progress saved on this device.');
});
document.getElementById('clearBtn').addEventListener('click', function(){
  if(confirm('Clear ALL saved answers across every question page? This cannot be undone.')){
    try{ localStorage.removeItem('etcs_kc_progress_page'); }catch(e){}
    DATA = {values:{}, autoScores:{}};
    document.querySelectorAll('input[type=text],input[type=date]').forEach(function(i){ i.value=''; });
    document.querySelectorAll('textarea.autoexp').forEach(function(t){ t.value=''; t.style.height='100px'; });
    document.querySelectorAll('input[type=radio]').forEach(function(r){ r.checked=false; });
    document.querySelectorAll('.mscore').forEach(function(m){ m.value=''; });
    document.querySelectorAll('.feedback').forEach(function(f){ f.style.display='none'; f.textContent=''; });
    updateScoreDisplay(DATA);
  }
});


function checkMC_a1(){
  const chosen = document.querySelector('input[name="a1"]:checked');
  const fb = document.querySelector('[data-qid="a1"] .feedback');
  if(!chosen){ fb.className='feedback incorrect'; fb.textContent='Select an answer first.'; fb.style.display='block'; return; }
  DATA.values['radio_a1'] = chosen.value;
  if(chosen.value==='b'){
    fb.className='feedback correct'; fb.textContent='Correct! (+2 pts)';
    DATA.autoScores['a1'] = 2;
  } else {
    fb.className='feedback incorrect'; fb.textContent='Not quite — review the lesson and try again.';
    DATA.autoScores['a1'] = 0;
  }
  fb.style.display='block';
  saveData(DATA);
  updateScoreDisplay(DATA);
}
(function(){
  const prevScore = DATA.autoScores['a1'];
  if(prevScore!==undefined){
    const fb = document.querySelector('[data-qid="a1"] .feedback');
    if(fb){
      fb.className = prevScore>0 ? 'feedback correct' : 'feedback incorrect';
      fb.textContent = prevScore>0 ? ('Correct! (+' + prevScore + ' pts)') : 'Not quite — review the lesson and try again.';
      fb.style.display='block';
    }
  }
})();

</script>
</body>
</html>
